name: Submission source-package tools
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Preserve Windows paths and source bytes before checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test package selection, integrity and path handling
        run: python -B -m unittest discover -s tools/tests -p test_package_submission.py -v
      - name: Audit the committed source closure and export selection without writing a package
        run: python -B tools/package_submission.py --ref HEAD --output .submission-package-ci-plan --plan-only
