name: Tile8 cache research saved evidence

on:
  pull_request:
    paths:
      - 'delivery/20261104-hdmi-camera-fisheye-tile8-cache-research/**'
      - '.github/workflows/fisheye-tile8-cache-research.yml'
  push:
    paths:
      - 'delivery/20261104-hdmi-camera-fisheye-tile8-cache-research/**'
      - '.github/workflows/fisheye-tile8-cache-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saved-research-evidence:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve bytes and permit long paths before Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Verify copied bytes, saved unit pixels and finite LRU cases
        run: >-
          python delivery/20261104-hdmi-camera-fisheye-tile8-cache-research/verify_research_portable_a.py
          --bundle delivery/20261104-hdmi-camera-fisheye-tile8-cache-research
