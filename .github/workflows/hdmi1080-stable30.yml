name: HDMI stable30 source and evidence checks

on:
  push:
    paths:
      - 'delivery/20261103-hdmi1080-stable30/**'
      - 'delivery/20261103-hdmi1080-demo-source/**'
      - '.github/workflows/hdmi1080-stable30.yml'
  pull_request:
    paths:
      - 'delivery/20261103-hdmi1080-stable30/**'
      - 'delivery/20261103-hdmi1080-demo-source/**'
      - '.github/workflows/hdmi1080-stable30.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source bytes and support vendor long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify sealed candidate source and evidence bindings
        run: python -B delivery/20261103-hdmi1080-stable30/tools/verify_candidate.py
      - name: Reject changed RTL, constraints, overlays and seals
        env:
          FPGA_TEST_TMP: ${{ runner.temp }}
        run: python -B -m unittest discover -s delivery/20261103-hdmi1080-stable30/tests -p test_candidate.py -v
