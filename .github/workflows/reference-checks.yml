name: Reference and handoff checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: distortion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install -r requirements-team.txt
      - name: Audit shipped baselines and IP dependency closure
        run: python handoff/audit-baselines.py
      - name: Verify initial handoff snapshot
        if: github.ref == 'refs/tags/handoff-20261010'
        run: python handoff/verify-files.py
      - name: Run CPU reference and protocol tests
        run: |
          mkdir -p distortion/build
          cp -r handoff/reference-fixtures/host_control_sim distortion/build/
          python -m pytest -q distortion/tests/test_reference.py distortion/tests/test_calibrate.py distortion/tests/test_host_protocol.py distortion/tests/test_frame_protocol.py distortion/tests/test_slanted_edge_analysis.py distortion/tests/test_grid_straightness.py distortion/tests/test_chessboard_sharpness.py distortion/tests/test_gamma_triplets.py distortion/tests/test_native_optical_audit.py distortion/tests/test_pds_source_manifest.py
