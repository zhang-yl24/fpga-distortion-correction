name: Reference and handoff checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: distortion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install -r requirements-team.txt
      - name: Audit shipped baselines and IP dependency closure
        run: python handoff/audit-baselines.py
      - name: Check HDMI UART decoder, receive-only lifecycle and native report audit
        run: python -m pytest -q -p no:cacheprovider distortion/tests/test_hdmi_status.py distortion/tests/test_hdmi_uart_native_audit.py distortion/tests/test_assess_hdmi_input.py distortion/tests/test_prepare_hdmi_input_bitstream.py distortion/tests/test_verify_hdmi_input_bitstream.py distortion/tests/test_prepare_hdmi_input_program.py distortion/tests/test_execute_hdmi_input_program.py distortion/tests/test_audit_hdmi_trained_native.py
      - name: Check camera upright control and audit CPU logic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider distortion/tests/test_ov5640_cadence_upright_sim.py distortion/tests/test_camera_vga_upright_io_cdc.py distortion/tests/test_camera_vga_upright_physical.py distortion/tests/test_camera_vga_upright_route_reset.py distortion/tests/test_camera_vga_upright_reset_effect.py distortion/tests/test_camera_vga_upright_program.py distortion/tests/test_camera_vga_upright_program_fast.py distortion/tools/test_camera_vga_upright_reset.py distortion/tools/test_camera_vga_upright_io_cdc_native.py
      - name: Verify initial handoff snapshot
        if: github.ref == 'refs/tags/handoff-20261010'
        run: python handoff/verify-files.py
      - name: Check portable 720p camera, correction and statistics logic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          # These native command/fixture tests require Windows path semantics.
          # The windows-720 job runs the COMPLETE 720p suite, including these.
          windows_native = {
              'test_camera720_inspect.py',
              'test_camera720_raw_inspect.py',
              'test_camera720_output_prepare.py',
              'test_camera720_calibrated_inspect.py',
              'test_camera720_raw_prepare.py',
              'test_camera720_raw_physical.py',
              'test_camera720_raw_reset_closure.py',
              'test_camera720_reset_inspect.py',
              'test_camera720_calibrated_preparation.py',
              'test_camera720_stage_fast.py',
          }
          files = sorted(Path('distortion/tests').glob('test_camera720_*.py'))
          assert windows_native <= {p.name for p in files}
          selected = [str(p) for p in files if p.name not in windows_native]
          selected.append('distortion/tests/test_prepare_stats_delay_final_c.py')
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q',
                                   '-p', 'no:cacheprovider', *selected]))
          PY
      - name: Verify 720p statistics evidence and replay saved UART
        run: python -B distortion/results/camera720-stats-live-20261102-a/verify_bundle.py
      - name: Run CPU reference and protocol tests
        run: |
          mkdir -p distortion/build
          cp -r handoff/reference-fixtures/host_control_sim distortion/build/
          python -m pytest -q distortion/tests/test_reference.py distortion/tests/test_calibrate.py distortion/tests/test_host_protocol.py distortion/tests/test_frame_protocol.py distortion/tests/test_slanted_edge_analysis.py distortion/tests/test_grid_straightness.py distortion/tests/test_chessboard_sharpness.py distortion/tests/test_gamma_triplets.py distortion/tests/test_native_optical_audit.py distortion/tests/test_pds_source_manifest.py distortion/tests/test_completed_angle_coverage.py distortion/tests/test_session_capture_scope.py distortion/tests/test_host_cli.py distortion/tests/test_camera_mode_preflight.py distortion/tests/test_wideangle_mapping_audit.py distortion/tests/test_stereo_fisheye_calibrate.py distortion/tests/test_camera_eye_pin_audit.py distortion/tests/test_native_camera_capture.py distortion/tests/test_calibrate_fisheye_profile.py distortion/tests/test_program_native_raw.py distortion/tests/test_program_idle_heartbeat.py distortion/tests/test_bounded_native_bringup.py distortion/tests/test_native_scene_diagnostics.py distortion/tests/test_bounded_diagnostic.py distortion/tests/test_analyze_headless_diagnostic.py distortion/tests/test_build_camera_isp_probe_d5.py
      # Portable CPU-only coverage: UART/JTAG lifecycles are mocked. Local
      # CAM1/colorbar factory tests require retained Windows build artifacts.
      - name: Run guarded CPU codec, mock lifecycle and corpus tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            distortion/tests/test_guarded_protocol.py \
            distortion/tests/test_audit_guarded_wire.py \
            distortion/tests/test_guarded_simulation_corpus.py \
            distortion/tests/test_guarded_native_session.py \
            distortion/tests/test_analyze_guarded_colorbars.py
      - name: Run transaction diagnostics and clock-action CPU tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            distortion/tests/test_cam1_transaction_protocol.py \
            distortion/tests/test_cam1_transaction_session.py \
            distortion/tests/test_ov5640_clock_sequence_audit.py
      - name: Audit DDR reference comparison logic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            distortion/tests/test_audit_ddr_reference.py \
            distortion/tests/test_prepare_ddr_ip_reset_constraints.py \
            distortion/tests/test_prepare_ddr_pin_query_probe.py \
            distortion/tests/test_ddr_entry_reset_netlist.py \
            distortion/tests/test_ddr_native_recovery_constraints.py \
            distortion/tests/test_prepare_ddr_native_reset_scope.py \
            distortion/tests/test_prepare_ddr_timing_repair.py \
            distortion/tests/test_audit_ddr_final_timing.py \
            distortion/tests/test_audit_ddr_recovery_variants.py \
            distortion/tests/test_audit_fresh_ddr_timing.py \
            distortion/tests/test_prepare_fresh_ddr_timing_repair.py
      - name: Run 1080 evidence and simulation-tool CPU tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            distortion/tests/test_assess_1080_artifacts.py \
            distortion/tests/test_assess_1080_latency.py \
            distortion/tests/test_assess_1080_evidence.py \
            distortion/tests/test_simulation_tools.py \
            distortion/tests/test_board1080_rowpipe_integration.py \
            distortion/tests/test_run_board1080_rowpipe_control_sim.py \
            distortion/tests/test_prepare_board1080_timing.py \
            distortion/tests/test_prepare_board1080_bitstream.py \
            distortion/tests/test_prepare_fresh_board1080_bitstream.py
      - name: Check HDMI30 profile and board pin contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            distortion/tests/test_board1080_edid.py \
            distortion/tests/test_prepare_board1080_hdmi30.py \
            distortion/tests/test_run_board1080_hdmi30_sim.py \
            distortion/tests/test_audit_board1080_pin_contract.py \
            distortion/tests/test_audit_hdmi30_build.py \
            distortion/tests/test_run_iic_dri_checked_sim.py \
            distortion/tests/test_ms72xx_checked_sim.py \
            distortion/tests/test_board1080_checked_top.py \
            distortion/tests/test_board1080_checked_profile.py \
            distortion/tests/test_prepare_board1080_checked.py \
            distortion/tests/test_audit_checked_build.py \
            distortion/tests/test_prepare_checked_native_probe.py \
            distortion/tests/test_audit_checked_io_netlist.py \
            distortion/tests/test_audit_checked_ddr_timing.py \
            distortion/tests/test_prepare_checked_board1080_bitstream.py
  windows-720:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: distortion
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source and evidence byte identities
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install -r requirements-team.txt
      - name: Check full 720p suite with native Windows path semantics
        shell: bash
        run: python -m pytest -q -p no:cacheprovider distortion/tests/test_camera720_*.py distortion/tests/test_prepare_stats_delay_final_c.py
      - name: Verify byte-preserved evidence and replay saved UART
        run: python -B distortion/results/camera720-stats-live-20261102-a/verify_bundle.py
