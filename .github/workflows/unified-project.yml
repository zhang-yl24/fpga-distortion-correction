name: Unified project catalog and default build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve Windows paths and source bytes
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python project.py audit
      - run: python -m unittest discover -s tests -p test_main_project.py
      - run: python project.py verify --variant tile8
      - run: python project.py prepare --variant tile8 --output .bld-main
