name: HDMI source delivery checks
on:
  push:
    paths:
      - 'delivery/20261103-hdmi1080-demo-source/**'
      - '.github/workflows/hdmi-source-delivery.yml'
  pull_request:
    paths:
      - 'delivery/20261103-hdmi1080-demo-source/**'
      - '.github/workflows/hdmi-source-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Preserve byte identities and support existing vendor long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify byte-preserved source package and dependency boundary
        run: python -B delivery/20261103-hdmi1080-demo-source/tools/verify_package.py
      - name: Verify source-only offline diagnostic candidate closures
        run: python -B delivery/20261103-hdmi1080-demo-source/tools/verify_offline_candidates.py
      - name: Check exact DMA paired-test inputs and original CPU oracle
        run: python -B delivery/20261103-hdmi1080-demo-source/offline-candidates/20261103-night/tests/dma-grant-equivalence/run_pair.py --check-only
      - name: Verify exact PGSTAT02 v1 sources and run 34 memory tests
        run: python -B delivery/20261103-hdmi1080-demo-source/measurement/pgstat02-v1/run_delivery_checks.py --scratch-parent "${{ runner.temp }}"
