name: Fisheye tile8 portable delivery
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Preserve Windows paths and evidence bytes
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify selected source and byte-preserved archive
        shell: bash
        run: |
          python -B delivery/20261103-hdmi-camera-fisheye-tile8/verify_source.py
          python -B distortion/results/hdmi-camera-fisheye-tile8-20261103-a/verify_archive_portable.py --manifest portable-evidence-manifest-c.json
          python -B distortion/tools/verify_fisheye_tile8_archive.py
      - name: Prepare and verify fresh build inputs without EDA
        shell: bash
        run: |
          python -B delivery/20261103-hdmi-camera-fisheye-tile8/prepare_build.py --output .bld-tile8-ci
          python -B delivery/20261103-hdmi-camera-fisheye-tile8/verify_source.py --prepared .bld-tile8-ci
